<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Medorra</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #080b0f;
        color: #e6edf3;
        text-align: center;
      }
      .card { max-width: 22rem; }
      .mark {
        width: 64px; height: 64px; margin: 0 auto 20px;
        display: flex; align-items: center; justify-content: center;
        border-radius: 18px;
        background: linear-gradient(135deg, #14b8a6, #0f766e);
      }
      h1 { font-size: 1.25rem; margin: 0 0 8px; }
      p { color: #9aa8b6; font-size: 0.9rem; line-height: 1.5; margin: 0 0 20px; }
      button {
        appearance: none; border: 0; cursor: pointer;
        background: #14b8a6; color: #041412;
        font-weight: 600; font-size: 0.9rem;
        padding: 10px 20px; border-radius: 10px;
      }
      button:hover { background: #2dd4bf; }
      .hint { margin-top: 16px; font-size: 0.8rem; color: #6b7a89; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" width="34" height="34">
          <path d="M4 13h3l2 5 3-11 2.5 7L18 13h2" stroke="#fff"
            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        Medorra can't reach the network right now. Any entries you log will be
        saved on this device and synced automatically once you're back online.
      </p>
      <button onclick="location.reload()">Try again</button>
      <p class="hint">Your queued entries are safe.</p>
    </div>
  </body>
</html>
